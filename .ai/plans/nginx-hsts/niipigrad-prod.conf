# Canonical HTTPS — niipigrad.ru
server {
    server_name niipigrad.ru;

    root /var/www/niipigrad-prod/current/public;
    index index.php;

    client_max_body_size 256M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Security headers — дублируются в 4 location с собственным add_header
    # (/vendor/livewire/, /vendor/filament/, /storage/, статика-regex) и
    # в www-HTTPS-301 ниже. Иначе наследование add_header рвётся.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /vendor/livewire/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location ^~ /vendor/filament/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Публичные загрузки (симлинк на storage/app/public). ^~ отменяет regex —
    # никакого .php$ exec, даже если через админку зальют shell.
    # Nested location — deny dotfiles (^~ выше отменил regex-защиту сверху).
    location ^~ /storage/ {
        location ~ /\. {
            deny all;
        }
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Должен идти ПЕРЕД regex статики (first-match-wins для regex).
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Только index.php исполняется через PHP-FPM. Всё остальное .php — 404.
    # В public/ у проекта один-единственный .php (index.php) — Laravel-паттерн.
    # $realpath_root — резолвит симлинк current/ в реальный путь релиза,
    # чтобы OPcache ключился на путь релиза и не отдавал старый байткод
    # после переключения симлинка при деплое.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 150;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # ipv6only=on — сокет-параметр, задаётся только в первом объявлении [::]:443.
    listen [::]:443 ssl http2 ipv6only=on;
    listen 443 ssl http2;
    ssl_certificate /etc/ssl/prod/_.niipigrad.ru.crt;
    ssl_certificate_key /etc/ssl/prod/_.niipigrad.ru.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
}

# www.niipigrad.ru → 301 на apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.niipigrad.ru;
    ssl_certificate /etc/ssl/prod/_.niipigrad.ru.crt;
    ssl_certificate_key /etc/ssl/prod/_.niipigrad.ru.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 301 https://niipigrad.ru$request_uri;
}

# HTTP → 301 на HTTPS apex. HSTS по HTTP запрещён RFC 6797 §7.2.
server {
    listen 80;
    listen [::]:80;
    server_name niipigrad.ru www.niipigrad.ru;
    return 301 https://niipigrad.ru$request_uri;
}
