# ============================================================
# stage.niipigrad.ru — HTTPS server-блок.
# Сертификат Let's Encrypt, обновляется Certbot.
# Не трогаем строки, помеченные "managed by Certbot", —
# он их перезаписывает при renewal.
# ============================================================
server {
    server_name stage.niipigrad.ru;

    root /var/www/niipigrad-stage/current/public;
    index index.php;

    client_max_body_size 256M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # HSTS max-age=300. Держим коротким осознанно, но НЕ ради «не залипнуть на
    # сломанном TLS» — эта защита мнимая: прод отдаёт includeSubDomains, а
    # stage — его поддомен, так что браузер, заходивший на niipigrad.ru, пинит
    # stage на год независимо от того, что stage отвечает сам. Короткий max-age
    # тут просто ничего не делает, и поднимать его смысла нет: он не добавит
    # защиты, но потянет дублирование HSTS во все location со своим add_header
    # (/vendor/*, статика) — add_header не наследуется.
    add_header Strict-Transport-Security "max-age=300" always;

    # Gzip
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Livewire updates — динамический endpoint, всегда через PHP.
    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire JS — физический файл из public/vendor/livewire/, кешируем.
    location ^~ /vendor/livewire/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
    }

    # Filament assets — физические файлы из public/vendor/filament/.
    location ^~ /vendor/filament/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Запрет доступа к скрытым файлам (.env, .git), кроме /.well-known/.
    # Должен идти ПЕРЕД regex статики (first-match-wins для regex), иначе
    # /.hidden.js матчится статикой и отдаётся мимо запрета.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Только index.php исполняется через PHP-FPM, как на проде.
    # $realpath_root, а не $document_root: php-fpm тут один пул на оба стенда
    # (`listen = /run/php/php8.4-fpm.sock`), а в нём opcache.validate_timestamps=0.
    # С неразрешённым симлинком current/ ключ кэша не меняется между релизами,
    # и старый байткод живёт до reload php-fpm. $realpath_root даёт каждому
    # релизу собственные ключи.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 150;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    # Кеширование статики (css/js/img/fonts) на год.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stage.niipigrad.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stage.niipigrad.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ============================================================
# HTTP (80) → 301 на HTTPS.
# Блок целиком сгенерирован Certbot — не редактируем.
# HSTS не добавляем (по HTTP запрещено RFC 6797 §7.2).
# ============================================================
server {
    if ($host = stage.niipigrad.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name stage.niipigrad.ru;
    return 404; # managed by Certbot
}
