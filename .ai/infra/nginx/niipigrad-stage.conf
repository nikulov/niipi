# ============================================================
# stage.niipigrad.ru — HTTPS server-блок.
# Сертификат Let's Encrypt, обновляется Certbot.
# Не трогаем строки, помеченные "managed by Certbot", —
# он их перезаписывает при renewal.
# ============================================================
server {
    server_name stage.niipigrad.ru;

    root /var/www/niipigrad-stage/current/public;
    index index.php;

    client_max_body_size 256M;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # HSTS — короткий max-age (5 минут) на время обкатки:
    # если TLS на stage сломается, клиенты не залипнут надолго.
    # Поднимем до боевого значения, когда убедимся в стабильности.
    # В /vendor/livewire/, /vendor/filament/ и статике HSTS НЕ дублируем —
    # max-age короткий, ценность дубля минимальна; при поднятии max-age
    # нужно будет добавить (см. шаг 6 плана).
    add_header Strict-Transport-Security "max-age=300" always;

    # Gzip
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Livewire updates — динамический endpoint, всегда через PHP.
    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire JS — физический файл из public/vendor/livewire/, кешируем.
    location ^~ /vendor/livewire/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
    }

    # Filament assets — физические файлы из public/vendor/filament/.
    location ^~ /vendor/filament/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 150;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Кеширование статики (css/js/img/fonts) на год.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Запрет доступа к скрытым файлам (.env, .git), кроме /.well-known/.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stage.niipigrad.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stage.niipigrad.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ============================================================
# HTTP (80) → 301 на HTTPS.
# Блок целиком сгенерирован Certbot — не редактируем.
# HSTS не добавляем (по HTTP запрещено RFC 6797 §7.2).
# ============================================================
server {
    if ($host = stage.niipigrad.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name stage.niipigrad.ru;
    return 404; # managed by Certbot
}
